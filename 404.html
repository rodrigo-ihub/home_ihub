<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada — iHub Tecnologia</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0B1E2D">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="shortcut icon" href="/favicon.ico">
<style>
@font-face{font-family:"Space Grotesk";src:url("/assets/fonts/space-grotesk-700.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Plex Sans";src:url("/assets/fonts/plex-sans-400.woff2") format("woff2");font-weight:400;font-display:swap}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;padding:32px;
  background:#0B1E2D;color:#fff;
  font-family:"Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased
}
.box{max-width:560px;text-align:left}
img{height:36px;width:auto;display:block;margin-bottom:38px}
.code{font-family:"Space Grotesk",system-ui,sans-serif;font-size:14px;font-weight:700;letter-spacing:.08em;color:#0F8F77}
h1{font-family:"Space Grotesk",system-ui,sans-serif;font-size:clamp(1.8rem,5vw,2.6rem);font-weight:700;letter-spacing:-.02em;line-height:1.14;margin:14px 0 0}
p{margin:18px 0 0;color:rgba(255,255,255,.76)}
.acts{display:flex;flex-wrap:wrap;gap:14px;margin-top:34px}
a.btn{
  display:inline-flex;align-items:center;justify-content:center;height:50px;padding:0 26px;
  border-radius:999px;font-family:"Space Grotesk",system-ui,sans-serif;font-weight:700;font-size:16px;
  text-decoration:none;border:1px solid transparent
}
a.btn.p{background:#0F8F77;color:#fff}
a.btn.p:hover{background:#0A6E5C}
a.btn.g{border-color:rgba(255,255,255,.34);color:#fff}
a.btn.g:hover{border-color:#fff;background:rgba(255,255,255,.08)}
:focus-visible{outline:3px solid #0F8F77;outline-offset:3px;border-radius:4px}
</style>
</head>
<body>
  <div class="box">
    <a href="/"><img src="/assets/img/iHub.webp" alt="iHub Tecnologia da Informação"></a>
    <span class="code">ERRO 404</span>
    <h1>Esta página não existe</h1>
    <p>O endereço pode ter mudado ou o link que trouxe você até aqui está desatualizado. Se precisar de ajuda, escreva para <a href="mailto:contato@ihub.com.br" style="color:#7FD9C5">contato@ihub.com.br</a>.</p>
    <div class="acts">
      <a class="btn p" href="/">Ir para a página inicial</a>
      <a class="btn g" href="/#contato">Falar com a iHub</a>
    </div>
  </div>
</body>
</html>
